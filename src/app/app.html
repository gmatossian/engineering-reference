<header class="application-header">
  <nav class="application-navigation" aria-label="Application navigation">
    <button class="back-control" type="button" [disabled]="backUnavailable" (click)="goBack()">
      <span class="back-control__arrow" aria-hidden="true">←</span>
      <span>Back</span>
    </button>

    <a class="application-name" routerLink="/">
      <img class="application-mark" src="icons/application-mark.svg" alt="" />
      <span>Engineering Reference</span>
    </a>
  </nav>
</header>

<main class="application-main">
  <router-outlet />
</main>
