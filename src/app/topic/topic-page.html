@if (topic(); as resolvedTopic) {
  <article class="topic-page">
    <header class="topic-page__header">
      <h1 tabindex="-1">{{ resolvedTopic.title }}</h1>
    </header>

    @if (resolvedTopic.mainContentHtml !== null) {
      <app-topic-content [html]="resolvedTopic.mainContentHtml" />
    }

    @if (childTopics(); as children) {
      @if (children.length > 0) {
        <div class="topic-page__children">
          <app-topic-link-list ariaLabel="Subtopics" [topics]="children" />
        </div>
      }
    }
  </article>
} @else {
  <app-topic-not-found />
}
