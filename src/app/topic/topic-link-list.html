<nav
  class="topic-links"
  [class.topic-links--curated]="presentation() === 'curated'"
  [attr.aria-label]="ariaLabel()"
>
  <ul>
    @for (topic of topics(); track topic.id) {
      <li>
        <a
          class="topic-link"
          [attr.data-icon-key]="topic.iconKey ?? 'generic'"
          [routerLink]="['/topics', topic.id]"
        >
          <app-topic-icon [iconKey]="topic.iconKey" />

          <span class="topic-link__copy">
            <span class="topic-link__title">{{ topic.title }}</span>

            @if (presentation() === 'curated' && topic.summary !== null) {
              <span class="topic-link__summary">{{ topic.summary }}</span>
            }
          </span>

          <span class="topic-link__chevron" aria-hidden="true"></span>
        </a>
      </li>
    }
  </ul>
</nav>
