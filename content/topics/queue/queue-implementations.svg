<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" role="img" aria-labelledby="title description">
  <title id="title">Common Queue and Deque implementations</title>
  <desc id="description">
    Deque extends Queue. PriorityQueue implements Queue directly. ArrayDeque and LinkedList implement Deque and can therefore also be used as queues.
  </desc>

  <defs>
    <style>
      .interface { fill: #ffffff; stroke: #c6c1b6; stroke-width: 2; }
      .implementation { fill: #eef4ff; stroke: #2457a7; stroke-width: 2; }
      .branch { fill: none; stroke: #76777b; stroke-width: 2; }
      .type { fill: #1b1c19; font: 600 18px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .kind { fill: #5f6064; font: 500 13px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <path class="branch" d="M420 76v45H230v30" />
  <path class="branch" d="M420 121h210v30" />
  <path class="branch" d="M230 221v45H115v30" />
  <path class="branch" d="M230 266h230v30" />

  <rect class="interface" x="320" y="16" width="200" height="60" rx="8" />
  <text class="type" x="420" y="43">Queue&lt;E&gt;</text>
  <text class="kind" x="420" y="63">interface</text>

  <rect class="interface" x="130" y="151" width="200" height="70" rx="8" />
  <text class="type" x="230" y="181">Deque&lt;E&gt;</text>
  <text class="kind" x="230" y="203">extends Queue</text>

  <rect class="implementation" x="525" y="151" width="210" height="70" rx="8" />
  <text class="type" x="630" y="181">PriorityQueue&lt;E&gt;</text>
  <text class="kind" x="630" y="203">implements Queue</text>

  <rect class="implementation" x="20" y="296" width="190" height="70" rx="8" />
  <text class="type" x="115" y="326">ArrayDeque&lt;E&gt;</text>
  <text class="kind" x="115" y="348">implements Deque</text>

  <rect class="implementation" x="355" y="296" width="210" height="70" rx="8" />
  <text class="type" x="460" y="326">LinkedList&lt;E&gt;</text>
  <text class="kind" x="460" y="348">implements Deque</text>
</svg>
