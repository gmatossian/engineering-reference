<svg xmlns="http://www.w3.org/2000/svg" width="360" height="487.5" viewBox="0 0 480 650" role="img" aria-labelledby="title description">
  <title id="title">CDN cache hit and cache miss</title>
  <desc id="description">A hit returns cached content from the CDN without contacting the origin. A miss causes the CDN to fetch from the origin, serve the response to the client, and cache it if eligible.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#52616d"/></marker>
    <style>
      text { font-family: 'Avenir Next', 'Segoe UI', sans-serif; fill: #1b1c19; }
      .heading { font-size: 23px; font-weight: 700; }
      .node { font-size: 23px; font-weight: 600; text-anchor: middle; }
      .label { font-size: 19px; text-anchor: middle; fill: #4f5054; }
      .line { fill: none; stroke: #52616d; stroke-width: 2; marker-end: url(#arrow); }
      .box { fill: #fff; stroke: #c6c1b6; stroke-width: 2; }
      .edge { fill: #eaf7ef; stroke: #2f8d5c; stroke-width: 2; }
    </style>
  </defs>
  <rect x="1" y="1" width="478" height="207" rx="12" fill="#f7f8fa"/>
  <text class="heading" x="22" y="37">HIT · no origin request</text>
  <rect class="box" x="22" y="85" width="125" height="65" rx="9"/>
  <text class="node" x="84" y="125">Client</text>
  <rect class="edge" x="325" y="85" width="132" height="65" rx="9"/>
  <text class="node" x="391" y="125">CDN</text>
  <path class="line" d="M147 100H325"/>
  <text class="label" x="235" y="86">Request</text>
  <path class="line" d="M325 138H147"/>
  <text class="label" x="235" y="173">Cached response</text>
  <rect x="1" y="225" width="478" height="423" rx="12" fill="#f7f8fa"/>
  <text class="heading" x="22" y="263">MISS · fetch, then serve</text>
  <rect class="box" x="145" y="290" width="190" height="59" rx="9"/>
  <text class="node" x="240" y="327">Client</text>
  <rect class="edge" x="145" y="423" width="190" height="59" rx="9"/>
  <text class="node" x="240" y="460">CDN</text>
  <rect class="box" x="145" y="557" width="190" height="59" rx="9"/>
  <text class="node" x="240" y="594">Origin</text>
  <path class="line" d="M190 349V423"/>
  <text class="label" x="122" y="389">Request</text>
  <path class="line" d="M290 423V349"/>
  <text class="label" x="368" y="379">Serve;</text>
  <text class="label" x="368" y="402">cache if eligible</text>
  <path class="line" d="M190 482V557"/>
  <text class="label" x="122" y="524">Fetch</text>
  <path class="line" d="M290 557V482"/>
  <text class="label" x="365" y="524">Response</text>
</svg>
