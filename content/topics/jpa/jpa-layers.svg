<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" role="img" aria-labelledby="title description">
  <title id="title">Common Spring Data JPA persistence path</title>
  <desc id="description">
    A Spring Data repository delegates to the Jakarta Persistence EntityManager and its persistence context. Hibernate implements that contract and issues SQL to the relational database.
  </desc>

  <defs>
    <style>
      .optional { fill: #f7f3ea; stroke: #9b7b32; stroke-width: 2; }
      .contract { fill: #ffffff; stroke: #c6c1b6; stroke-width: 2; }
      .provider { fill: #eef4ff; stroke: #2457a7; stroke-width: 2; }
      .database { fill: #f7eee9; stroke: #9a4f32; stroke-width: 2; }
      .arrow { fill: none; stroke: #76777b; stroke-width: 2; marker-end: url(#arrowhead); }
      .type { fill: #1b1c19; font: 600 18px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .kind { fill: #5f6064; font: 500 13px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .label { fill: #5f6064; font: 500 13px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#76777b" />
    </marker>
  </defs>

  <rect class="optional" x="230" y="20" width="420" height="70" rx="8" />
  <text class="type" x="440" y="50">Spring Data JPA repository</text>
  <text class="kind" x="440" y="72">optional repository abstraction</text>

  <path class="arrow" d="M440 90v50" />

  <rect class="contract" x="230" y="140" width="420" height="76" rx="8" />
  <text class="type" x="440" y="171">EntityManager + persistence context</text>
  <text class="kind" x="440" y="195">Jakarta Persistence contract</text>

  <path class="arrow" d="M440 216v50" />

  <rect class="provider" x="230" y="266" width="420" height="70" rx="8" />
  <text class="type" x="440" y="296">Hibernate ORM</text>
  <text class="kind" x="440" y="318">JPA provider</text>

  <path class="arrow" d="M440 336v50" />
  <text class="label" x="460" y="368">SQL</text>

  <rect class="database" x="230" y="386" width="420" height="34" rx="8" />
  <text class="type" x="440" y="409">Relational database</text>
</svg>
