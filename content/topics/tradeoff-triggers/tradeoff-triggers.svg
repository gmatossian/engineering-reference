<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 900" role="img" aria-labelledby="title description">
  <title id="title">Decision paths for common system design trade-offs</title>
  <desc id="description">
    Six requirement questions lead toward relational or access-pattern storage, synchronous or asynchronous work, queue or stream delivery, replication or partitioning, strong or eventual consistency, and cache or authoritative reads. Each choice names its main cost.
  </desc>

  <defs>
    <style>
      .panel { fill: #ffffff; stroke: #d7d1c5; stroke-width: 2; }
      .question { fill: #f5f1e8; stroke: #bdb5a7; stroke-width: 2; }
      .choice { fill: #eef4ff; stroke: #5276ad; stroke-width: 2; }
      .branch { fill: none; stroke: #85817a; stroke-width: 2; }
      .question-text { fill: #20211f; font: 650 17px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .choice-title { fill: #1f3657; font: 700 16px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .cost { fill: #555752; font: 500 13px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .label { fill: #6a675f; font: 650 12px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <!-- Relational or access-pattern store -->
  <rect class="panel" x="20" y="20" width="530" height="265" rx="14" />
  <rect class="question" x="115" y="42" width="340" height="58" rx="10" />
  <text class="question-text" x="285" y="68">Need joins, constraints, transactions,</text>
  <text class="question-text" x="285" y="90">or flexible queries?</text>
  <path class="branch" d="M285 100v34M285 134H150v22M285 134h135v22" />
  <text class="label" x="206" y="128">YES</text>
  <text class="label" x="365" y="128">NO, KNOWN ACCESS PATTERN</text>
  <rect class="choice" x="45" y="156" width="210" height="102" rx="10" />
  <text class="choice-title" x="150" y="184">Relational</text>
  <text class="cost" x="150" y="211">Cost: schema coordination</text>
  <text class="cost" x="150" y="232">and harder cross-shard work</text>
  <rect class="choice" x="315" y="156" width="210" height="102" rx="10" />
  <text class="choice-title" x="420" y="184">Access-pattern store</text>
  <text class="cost" x="420" y="211">Cost: duplication and</text>
  <text class="cost" x="420" y="232">application-level invariants</text>

  <!-- Synchronous or asynchronous -->
  <rect class="panel" x="570" y="20" width="530" height="265" rx="14" />
  <rect class="question" x="665" y="42" width="340" height="58" rx="10" />
  <text class="question-text" x="835" y="68">Must the caller receive the result</text>
  <text class="question-text" x="835" y="90">in this response?</text>
  <path class="branch" d="M835 100v34M835 134H700v22M835 134h135v22" />
  <text class="label" x="756" y="128">YES</text>
  <text class="label" x="946" y="128">NO</text>
  <rect class="choice" x="595" y="156" width="210" height="102" rx="10" />
  <text class="choice-title" x="700" y="184">Synchronous</text>
  <text class="cost" x="700" y="211">Cost: coupled latency</text>
  <text class="cost" x="700" y="232">and availability</text>
  <rect class="choice" x="865" y="156" width="210" height="102" rx="10" />
  <text class="choice-title" x="970" y="184">Asynchronous</text>
  <text class="cost" x="970" y="211">Cost: lag, retries, state,</text>
  <text class="cost" x="970" y="232">and duplicate handling</text>

  <!-- Queue or stream -->
  <rect class="panel" x="20" y="310" width="530" height="265" rx="14" />
  <rect class="question" x="115" y="332" width="340" height="58" rx="10" />
  <text class="question-text" x="285" y="358">Must multiple consumers replay</text>
  <text class="question-text" x="285" y="380">or derive independent views?</text>
  <path class="branch" d="M285 390v34M285 424H150v22M285 424h135v22" />
  <text class="label" x="206" y="418">NO</text>
  <text class="label" x="365" y="418">YES</text>
  <rect class="choice" x="45" y="446" width="210" height="102" rx="10" />
  <text class="choice-title" x="150" y="474">Queue</text>
  <text class="cost" x="150" y="501">Cost: history is less</text>
  <text class="cost" x="150" y="522">available for replay</text>
  <rect class="choice" x="315" y="446" width="210" height="102" rx="10" />
  <text class="choice-title" x="420" y="474">Stream / log</text>
  <text class="cost" x="420" y="501">Cost: retention, offsets,</text>
  <text class="cost" x="420" y="522">partitions, and replay discipline</text>

  <!-- Replicate or partition -->
  <rect class="panel" x="570" y="310" width="530" height="265" rx="14" />
  <rect class="question" x="665" y="332" width="340" height="58" rx="10" />
  <text class="question-text" x="835" y="358">Do writes or total data exceed</text>
  <text class="question-text" x="835" y="380">one authority's capacity?</text>
  <path class="branch" d="M835 390v34M835 424H700v22M835 424h135v22" />
  <text class="label" x="756" y="418">NO, SCALE READS</text>
  <text class="label" x="946" y="418">YES</text>
  <rect class="choice" x="595" y="446" width="210" height="102" rx="10" />
  <text class="choice-title" x="700" y="474">Replicate</text>
  <text class="cost" x="700" y="501">Cost: lag and</text>
  <text class="cost" x="700" y="522">failover decisions</text>
  <rect class="choice" x="865" y="446" width="210" height="102" rx="10" />
  <text class="choice-title" x="970" y="474">Partition</text>
  <text class="cost" x="970" y="501">Cost: routing, hot keys,</text>
  <text class="cost" x="970" y="522">and cross-key work</text>

  <!-- Strong or eventual consistency -->
  <rect class="panel" x="20" y="600" width="530" height="265" rx="14" />
  <rect class="question" x="115" y="622" width="340" height="58" rx="10" />
  <text class="question-text" x="285" y="648">Could a stale read cause an</text>
  <text class="question-text" x="285" y="670">incorrect or unsafe decision?</text>
  <path class="branch" d="M285 680v34M285 714H150v22M285 714h135v22" />
  <text class="label" x="206" y="708">YES</text>
  <text class="label" x="365" y="708">NO</text>
  <rect class="choice" x="45" y="736" width="210" height="102" rx="10" />
  <text class="choice-title" x="150" y="764">Strong consistency</text>
  <text class="cost" x="150" y="791">Cost: coordination, latency,</text>
  <text class="cost" x="150" y="812">and availability pressure</text>
  <rect class="choice" x="315" y="736" width="210" height="102" rx="10" />
  <text class="choice-title" x="420" y="764">Eventual consistency</text>
  <text class="cost" x="420" y="791">Cost: reconciliation and</text>
  <text class="cost" x="420" y="812">visible temporary divergence</text>

  <!-- Cache or authority -->
  <rect class="panel" x="570" y="600" width="530" height="265" rx="14" />
  <rect class="question" x="665" y="622" width="340" height="58" rx="10" />
  <text class="question-text" x="835" y="648">Are reads repeated and</text>
  <text class="question-text" x="835" y="670">latency-sensitive?</text>
  <path class="branch" d="M835 680v34M835 714H700v22M835 714h135v22" />
  <text class="label" x="756" y="708">NO</text>
  <text class="label" x="946" y="708">YES</text>
  <rect class="choice" x="595" y="736" width="210" height="102" rx="10" />
  <text class="choice-title" x="700" y="764">Read the authority</text>
  <text class="cost" x="700" y="791">Cost: authority latency</text>
  <text class="cost" x="700" y="812">and load</text>
  <rect class="choice" x="865" y="736" width="210" height="102" rx="10" />
  <text class="choice-title" x="970" y="764">Cache</text>
  <text class="cost" x="970" y="791">Cost: invalidation, eviction,</text>
  <text class="cost" x="970" y="812">hot keys, and stale data</text>
</svg>
