<svg xmlns="http://www.w3.org/2000/svg" width="760" height="802" viewBox="0 0 760 802" role="img" aria-labelledby="title desc">
  <title id="title">Spring Framework modules and separate Spring projects</title>
  <desc id="desc">Spring Framework contains core container, data access and transaction, web, and testing modules. MVC and WebFlux belong to its web support. Separate projects including Spring Data, Security, Integration, and Batch build on the Framework. Spring Boot is optional and helps configure and run applications using the selected modules and projects. These are selected examples, not a complete inventory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#52616d"/>
    </marker>
    <style>
      text { font-family: 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; fill: #1b1c19; font-size: 20px; text-anchor: middle; }
      .heading { font-size: 22px; font-weight: 600; }
      .node { font-weight: 600; }
      .label { fill: #46474b; }
      .small { fill: #46474b; font-size: 18px; }
      .box { fill: #fff; stroke: #c6c1b6; stroke-width: 1.4; }
      .arrow { fill: none; stroke: #52616d; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="8" y="8" width="320" height="560" rx="8" fill="#f0f4f6" stroke="#c6c1b6" stroke-width="1.3"/>
  <text x="168" y="42" class="heading">Spring Framework</text>
  <text x="168" y="70" class="small">Selected parts inside it</text>

  <rect x="32" y="96" width="272" height="100" rx="8" class="box"/>
  <text x="168" y="129" class="node">Core container</text>
  <text x="168" y="158" class="label">DI · lifecycle</text>

  <rect x="32" y="212" width="272" height="100" rx="8" class="box"/>
  <text x="168" y="243" class="node">Data access</text>
  <text x="168" y="272" class="label">JDBC / ORM</text>
  <text x="168" y="297" class="label">Transactions</text>

  <rect x="32" y="328" width="272" height="100" rx="8" fill="#eaf7ef" stroke="#c6c1b6" stroke-width="1.4"/>
  <text x="168" y="359" class="node">Web</text>
  <text x="168" y="388" class="label">MVC · Servlet</text>
  <text x="168" y="413" class="label">WebFlux · reactive</text>

  <rect x="32" y="444" width="272" height="100" rx="8" class="box"/>
  <text x="168" y="475" class="node">Testing</text>
  <text x="168" y="504" class="label">TestContext</text>
  <text x="168" y="529" class="label">MockMvc</text>

  <rect x="432" y="8" width="320" height="560" rx="8" fill="#f7eee9" stroke="#c6c1b6" stroke-width="1.3"/>
  <text x="592" y="42" class="heading">Other projects</text>
  <text x="592" y="70" class="small">Separate from Framework</text>

  <rect x="456" y="96" width="272" height="100" rx="8" class="box"/>
  <text x="592" y="129" class="node">Spring Data</text>
  <text x="592" y="158" class="label">Repositories</text>

  <rect x="456" y="212" width="272" height="100" rx="8" class="box"/>
  <text x="592" y="243" class="node">Spring Security</text>
  <text x="592" y="272" class="label">Authentication</text>
  <text x="592" y="297" class="label">Authorization</text>

  <rect x="456" y="328" width="272" height="100" rx="8" class="box"/>
  <text x="592" y="359" class="node">Spring Integration</text>
  <text x="592" y="388" class="label">Message flows</text>
  <text x="592" y="413" class="label">System adapters</text>

  <rect x="456" y="444" width="272" height="100" rx="8" class="box"/>
  <text x="592" y="475" class="node">Spring Batch</text>
  <text x="592" y="504" class="label">Batch jobs</text>
  <text x="592" y="529" class="label">Restart · retry</text>

  <path d="M426 288H334" class="arrow"/>
  <text x="380" y="269" class="small">build on</text>

  <path d="M380 640V604H168V574" class="arrow"/>
  <path d="M380 604H592V574" class="arrow"/>

  <rect x="32" y="640" width="696" height="108" rx="8" fill="#eef4ff" stroke="#c6c1b6" stroke-width="1.4"/>
  <text x="380" y="672" class="heading">Spring Boot (optional)</text>
  <text x="380" y="702">Starters · auto-configuration</text>
  <text x="380" y="731" class="label">Application launch · packaging</text>
  <text x="380" y="785" class="label">Helps configure your chosen pieces.</text>
</svg>
