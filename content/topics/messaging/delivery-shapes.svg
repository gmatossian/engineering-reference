<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" role="img" aria-labelledby="title desc">
  <title id="title">Messaging delivery shapes</title>
  <desc id="desc">A work queue shares jobs between workers. Pubsub fans an event out to subscriptions. Log consumer groups track separate positions in retained history.</desc>
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7" fill="#526077"/>
    </marker>
  </defs>
  <rect width="360" height="760" rx="8" fill="#f8fafc"/>
  <g font-family="Arial,sans-serif" fill="#172337">
    <text x="16" y="30" font-size="19">Work queue: share jobs</text>
    <rect x="16" y="53" width="100" height="38" rx="7" fill="#e9effb" stroke="#7384a0"/>
    <text x="26" y="78" font-size="16">Producer</text>
    <rect x="180" y="53" width="160" height="38" rx="7" fill="#e9effb" stroke="#7384a0"/>
    <text x="190" y="78" font-size="16">Queue: A B C</text>
    <path d="M116 72 L179 72" fill="none" stroke="#526077" stroke-width="1.8" marker-end="url(#a)"/>
    <rect x="16" y="133" width="145" height="38" rx="7" fill="#e9effb" stroke="#7384a0"/>
    <text x="26" y="158" font-size="16">Worker 1: A</text>
    <rect x="194" y="133" width="145" height="38" rx="7" fill="#e9effb" stroke="#7384a0"/>
    <text x="204" y="158" font-size="16">Worker 2: B</text>
    <path d="M240 91 L90 132" fill="none" stroke="#526077" stroke-width="1.8" marker-end="url(#a)"/>
    <path d="M275 91 L266 132" fill="none" stroke="#526077" stroke-width="1.8" marker-end="url(#a)"/>
    <text x="16" y="205" font-size="16">Different workers receive different jobs.</text>
    <text x="16" y="227" font-size="16">Retries can repeat a job.</text>
    <path d="M16 246 H344" stroke="#ccd5e2"/>
    <text x="16" y="277" font-size="19">Pub/sub: fan out an event</text>
    <rect x="16" y="300" width="100" height="38" rx="7" fill="#e9effb" stroke="#7384a0"/>
    <text x="26" y="325" font-size="16">Producer</text>
    <rect x="196" y="300" width="144" height="38" rx="7" fill="#e9effb" stroke="#7384a0"/>
    <text x="206" y="325" font-size="16">Topic: E</text>
    <path d="M116 319 L195 319" fill="none" stroke="#526077" stroke-width="1.8" marker-end="url(#a)"/>
    <rect x="16" y="382" width="145" height="38" rx="7" fill="#e9effb" stroke="#7384a0"/>
    <text x="26" y="407" font-size="16">Sub A: event E</text>
    <rect x="194" y="382" width="145" height="38" rx="7" fill="#e9effb" stroke="#7384a0"/>
    <text x="204" y="407" font-size="16">Sub B: event E</text>
    <path d="M245 338 L90 381" fill="none" stroke="#526077" stroke-width="1.8" marker-end="url(#a)"/>
    <path d="M280 338 L266 381" fill="none" stroke="#526077" stroke-width="1.8" marker-end="url(#a)"/>
    <text x="16" y="454" font-size="16">Each subscription receives event E.</text>
    <text x="16" y="476" font-size="16">Its workers can share that backlog.</text>
    <path d="M16 496 H344" stroke="#ccd5e2"/>
    <text x="16" y="527" font-size="19">Retained log: read at own pace</text>
    <rect x="16" y="550" width="100" height="38" rx="7" fill="#e9effb" stroke="#7384a0"/>
    <text x="26" y="575" font-size="16">Producer</text>
    <rect x="176" y="550" width="164" height="38" rx="7" fill="#e9effb" stroke="#7384a0"/>
    <text x="186" y="575" font-size="16">E1 E2 E3 E4</text>
    <path d="M116 569 L175 569" fill="none" stroke="#526077" stroke-width="1.8" marker-end="url(#a)"/>
    <rect x="16" y="632" width="145" height="38" rx="7" fill="#e9effb" stroke="#7384a0"/>
    <text x="26" y="657" font-size="16">Group A: pos 2</text>
    <rect x="194" y="632" width="145" height="38" rx="7" fill="#e9effb" stroke="#7384a0"/>
    <text x="204" y="657" font-size="16">Group B: pos 4</text>
    <path d="M240 588 L90 631" fill="none" stroke="#526077" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="4 3"/>
    <path d="M275 588 L266 631" fill="none" stroke="#526077" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="4 3"/>
    <text x="16" y="704" font-size="16">One partition; independent positions.</text>
    <text x="16" y="726" font-size="16">Reading does not delete the events.</text>
  </g>
</svg>
