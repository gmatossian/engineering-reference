<svg xmlns="http://www.w3.org/2000/svg" width="580" height="476" viewBox="0 0 580 476" role="img" aria-labelledby="title desc">
  <title id="title">A create request and its saved response</title>
  <desc id="desc">POST /tickets sends Idempotency-Key K1 and a JSON request body. The saved result associates K1 with status 201, relevant response headers and a JSON response body. A new key creates a ticket and returns its response. Retrying K1 with the same data returns the saved 201, relevant headers and body without another creation. Reusing K1 with different data returns 422.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52616d"/></marker></defs>
  <style>
    text{font-family:'Avenir Next','Segoe UI',sans-serif;fill:#1b1c19;font-size:16px}
    .label{font-size:17px;font-weight:600}
    .mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:16px}
    .small{font-size:14px;fill:#4f5054}
    .line{stroke:#52616d;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <rect x="1" y="1" width="578" height="474" rx="7" fill="#f7f8fa" stroke="#e5e7eb"/>

  <rect x="16" y="20" width="252" height="176" rx="5" fill="#fff" stroke="#c6c1b6" stroke-width="1.5"/>
  <text x="29" y="50" class="label">Request</text>
  <text x="29" y="83" class="mono">POST /tickets</text>
  <text x="29" y="111" class="mono" font-weight="600">Idempotency-Key: K1</text>
  <text x="29" y="150" class="small">Body</text>
  <text x="115" y="150" class="mono">{ … }</text>
  <path d="M280 108H304" class="line"/>

  <rect x="316" y="20" width="248" height="176" rx="5" fill="#eaf7ef" stroke="#2f8d5c" stroke-width="1.5"/>
  <text x="329" y="50" class="label">Saved result</text>
  <text x="329" y="83" class="small">Key</text>
  <text x="474" y="83" class="mono">K1</text>
  <text x="329" y="111" class="small">Status</text>
  <text x="474" y="111" class="mono">201</text>
  <text x="329" y="142" class="small">Relevant headers</text>
  <text x="474" y="142" class="mono">{ … }</text>
  <text x="329" y="174" class="small">Body</text>
  <text x="474" y="174" class="mono">{ … }</text>

  <rect x="16" y="224" width="548" height="58" rx="4" fill="#fff" stroke="#c6c1b6"/>
  <text x="29" y="248" class="label">New key</text>
  <text x="29" y="270" class="small">Create ticket + save result</text>
  <path d="M280 253H302" class="line"/>
  <text x="316" y="248" class="label">201 Created</text>
  <text x="316" y="270" class="small">Return response</text>

  <rect x="16" y="300" width="548" height="34" fill="#f7f3ea"/>
  <path d="M17 300V334" stroke="#b18a56" stroke-width="3"/>
  <text x="29" y="322" class="small"><tspan font-weight="600">Response lost?</tspan> The ticket <tspan font-weight="600">may already exist</tspan>.</text>

  <rect x="16" y="352" width="548" height="58" rx="4" fill="#fff" stroke="#c6c1b6"/>
  <text x="29" y="376" class="label">Retry K1 + same data</text>
  <path d="M280 381H302" class="line"/>
  <text x="316" y="376" class="label">201 Created</text>
  <text x="29" y="398" class="small">No new creation</text>
  <text x="316" y="398" class="small">Replay saved response</text>

  <rect x="16" y="428" width="548" height="38" rx="4" fill="#fff" stroke="#c6c1b6"/>
  <text x="29" y="453" class="label">Reuse K1 + changed data</text>
  <path d="M280 447H302" class="line"/>
  <text x="316" y="453" class="label">422 · reject mismatch</text>
</svg>
