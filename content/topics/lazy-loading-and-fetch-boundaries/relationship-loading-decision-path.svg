<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title description">
  <title id="title">Decision path for choosing a relationship-loading strategy</title>
  <desc id="description">
    Start with a DTO projection for an exact read-only result. Use a fetch join or entity graph when one entity query needs a bounded relationship. Consider batch fetching when many parents access the same lazy relationship. Otherwise keep the relationship lazy.
  </desc>

  <defs>
    <style>
      .question { fill: #ffffff; stroke: #c6c1b6; stroke-width: 2; }
      .choice { fill: #eef4ff; stroke: #2457a7; stroke-width: 2; }
      .default { fill: #f7f3ea; stroke: #9b7b32; stroke-width: 2; }
      .arrow { fill: none; stroke: #76777b; stroke-width: 2; marker-end: url(#arrowhead); }
      .questionText { fill: #1b1c19; font: 600 18px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .choiceText { fill: #1b1c19; font: 600 17px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .edge { fill: #5f6064; font: 600 13px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#76777b" />
    </marker>
  </defs>

  <rect class="question" x="110" y="20" width="450" height="70" rx="10" />
  <text class="questionText" x="335" y="62">Exact read-only result shape?</text>
  <path class="arrow" d="M560 55h135" />
  <text class="edge" x="628" y="45">YES</text>
  <rect class="choice" x="695" y="20" width="210" height="70" rx="10" />
  <text class="choiceText" x="800" y="62">DTO projection</text>

  <path class="arrow" d="M335 90v72" />
  <text class="edge" x="355" y="128">NO</text>
  <rect class="question" x="110" y="162" width="450" height="70" rx="10" />
  <text class="questionText" x="335" y="204">One entity query needs a relationship?</text>
  <path class="arrow" d="M560 197h135" />
  <text class="edge" x="628" y="187">YES</text>
  <rect class="choice" x="695" y="162" width="210" height="70" rx="10" />
  <text class="choiceText" x="800" y="193">Fetch join or</text>
  <text class="choiceText" x="800" y="216">entity graph</text>

  <path class="arrow" d="M335 232v72" />
  <text class="edge" x="355" y="270">NO</text>
  <rect class="question" x="110" y="304" width="450" height="70" rx="10" />
  <text class="questionText" x="335" y="335">Many parents access the same</text>
  <text class="questionText" x="335" y="358">lazy relationship?</text>
  <path class="arrow" d="M560 339h135" />
  <text class="edge" x="628" y="329">YES</text>
  <rect class="choice" x="695" y="304" width="210" height="70" rx="10" />
  <text class="choiceText" x="800" y="346">Batch fetching</text>

  <path class="arrow" d="M335 374v82" />
  <text class="edge" x="355" y="416">NO</text>
  <rect class="default" x="225" y="456" width="220" height="76" rx="10" />
  <text class="choiceText" x="335" y="490">Keep it lazy</text>
  <text class="edge" x="335" y="514">LOAD ONLY WHEN NEEDED</text>
</svg>
