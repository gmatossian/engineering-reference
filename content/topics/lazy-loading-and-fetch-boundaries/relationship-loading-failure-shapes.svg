<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
  <title id="title">Three common relationship-loading failure shapes</title>
  <desc id="description">
    N plus one issues one parent query followed by many child queries. Closed-context access fails when unloaded data is accessed after the persistence context closes. A to-many join multiplies SQL rows even when JPA rebuilds fewer parent objects.
  </desc>

  <defs>
    <style>
      .card { fill: #ffffff; stroke: #c6c1b6; stroke-width: 2; }
      .step { fill: #f7f3ea; stroke: #9b7b32; stroke-width: 2; }
      .danger { fill: #f7eee9; stroke: #9a4f32; stroke-width: 2; }
      .data { fill: #eef4ff; stroke: #2457a7; stroke-width: 2; }
      .line { fill: none; stroke: #76777b; stroke-width: 2; marker-end: url(#arrowhead); }
      .branch { fill: none; stroke: #76777b; stroke-width: 2; }
      .heading { fill: #1b1c19; font: 600 20px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .label { fill: #1b1c19; font: 600 15px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .detail { fill: #5f6064; font: 500 13px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .accent { fill: #9a4f32; font: 600 14px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#76777b" />
    </marker>
  </defs>

  <rect class="card" x="15" y="15" width="290" height="330" rx="12" />
  <text class="heading" x="160" y="50">N+1 queries</text>
  <rect class="data" x="75" y="78" width="170" height="48" rx="8" />
  <text class="label" x="160" y="108">1 parent query</text>
  <path class="line" d="M160 126v42" />
  <rect class="danger" x="55" y="170" width="210" height="92" rx="8" />
  <text class="label" x="160" y="201">N child queries</text>
  <text class="detail" x="160" y="226">one per accessed parent</text>
  <text class="accent" x="160" y="304">Problem: round trips</text>

  <rect class="card" x="335" y="15" width="290" height="330" rx="12" />
  <text class="heading" x="480" y="50">Closed-context access</text>
  <rect class="step" x="355" y="90" width="70" height="44" rx="8" />
  <text class="label" x="390" y="117">Load</text>
  <path class="line" d="M425 112h35" />
  <rect class="step" x="462" y="90" width="70" height="44" rx="8" />
  <text class="label" x="497" y="117">Close</text>
  <path class="line" d="M532 112h35" />
  <rect class="danger" x="569" y="90" width="38" height="44" rx="8" />
  <text class="label" x="588" y="117">?</text>
  <text class="detail" x="480" y="179">Access unloaded relationship</text>
  <path class="line" d="M480 193v42" />
  <rect class="danger" x="395" y="237" width="170" height="48" rx="8" />
  <text class="label" x="480" y="267">Access fails</text>
  <text class="accent" x="480" y="316">Problem: lifecycle</text>

  <rect class="card" x="655" y="15" width="290" height="330" rx="12" />
  <text class="heading" x="800" y="50">To-many join</text>
  <rect class="data" x="685" y="82" width="100" height="50" rx="8" />
  <text class="label" x="735" y="112">Parent</text>
  <path class="branch" d="M785 107h36M821 107v-38M821 107v38M821 69h34M821 145h34" />
  <rect class="step" x="855" y="46" width="70" height="46" rx="8" />
  <text class="label" x="890" y="74">Child 1</text>
  <rect class="step" x="855" y="122" width="70" height="46" rx="8" />
  <text class="label" x="890" y="150">Child 2</text>
  <path class="line" d="M800 176v44" />
  <rect class="danger" x="700" y="222" width="200" height="62" rx="8" />
  <text class="label" x="800" y="248">Parent columns repeat</text>
  <text class="detail" x="800" y="270">SQL rows multiply</text>
  <text class="accent" x="800" y="316">Problem: result size</text>
</svg>
