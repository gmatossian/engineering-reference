<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220" role="img" aria-labelledby="title description">
  <title id="title">Write-through: cache layer coordinates both updates</title>
  <desc id="description">The application calls the cache layer, which updates cache storage such as Redis and the database. Branches show destinations, not necessarily parallel execution. Normally both updates complete before success.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52616d"/></marker>
    <style>
      text { font-family: 'Avenir Next', 'Segoe UI', sans-serif; fill: #1b1c19; font-size: 16px; text-anchor: middle; }
      .node { font-weight: 600; }
      .label { fill: #4f5054; }
      .line { fill: none; stroke: #52616d; stroke-width: 2; marker-end: url(#arrow); }
      .box { fill: #fff; stroke: #c6c1b6; stroke-width: 1.5; }
    </style>
  </defs>
  <rect x="1" y="1" width="438" height="218" rx="10" fill="#f7f8fa"/>
  <rect class="box" x="10" y="86" width="104" height="50" rx="8"/>
  <text class="node" x="62" y="117">Application</text>
  <path class="line" d="M114 111H153"/>
  <rect class="box" x="153" y="86" width="114" height="50" rx="8"/>
  <text class="node" x="210" y="117">Cache layer</text>
  <path class="line" d="M267 111H287V51H315"/>
  <path class="line" d="M267 111H287V185H315"/>
  <rect x="315" y="20" width="115" height="62" rx="8" fill="#eaf7ef" stroke="#2f8d5c" stroke-width="1.5"/>
  <text class="node" x="372" y="46">Cache storage</text>
  <text class="label" x="372" y="68">e.g. Redis</text>
  <rect class="box" x="315" y="160" width="115" height="50" rx="8"/>
  <text class="node" x="372" y="191">Database</text>
</svg>
