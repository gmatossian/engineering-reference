<svg xmlns="http://www.w3.org/2000/svg" width="520" height="470" viewBox="0 0 520 470" role="img" aria-labelledby="title desc">
  <title id="title">Two atomic purchases, one stale stock decision</title>
  <desc id="desc">At Read Committed isolation both requests read stock 1 and calculate 0. Request A writes 0 and commits an order. Request B then writes its stale calculated 0 and commits another order. Writes happen sequentially but two orders consume one unit.</desc>
  <rect width="520" height="470" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#172554">
    <text x="260" y="35" text-anchor="middle" font-size="21" font-weight="700">Stock starts at 1 · each buys 1</text>
    <rect x="24" y="55" width="224" height="45" rx="8" fill="#dbeafe"/>
    <rect x="272" y="55" width="224" height="45" rx="8" fill="#ede9fe"/>
    <text x="136" y="84" text-anchor="middle" font-size="21" font-weight="700">Request A</text>
    <text x="384" y="84" text-anchor="middle" font-size="21" font-weight="700">Request B</text>
    <path d="M136 110 V380 M384 110 V380" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
    <g fill="#ffffff" stroke="#cbd5e1">
      <rect x="24" y="120" width="224" height="48" rx="7"/>
      <rect x="272" y="120" width="224" height="48" rx="7"/>
      <rect x="24" y="188" width="224" height="48" rx="7"/>
      <rect x="272" y="188" width="224" height="48" rx="7"/>
      <rect x="24" y="256" width="224" height="48" rx="7"/>
      <rect x="272" y="324" width="224" height="48" rx="7"/>
    </g>
    <g text-anchor="middle" font-size="20">
      <text x="136" y="150">Read stock: 1</text>
      <text x="384" y="150">Read stock: 1</text>
      <text x="136" y="218">Calculate: 1 − 1 = 0</text>
      <text x="384" y="218">Calculate: 1 − 1 = 0</text>
      <text x="136" y="286">Write 0 + commit A</text>
      <text x="384" y="354">Write 0 + commit B</text>
    </g>
    <path d="M248 280 H260 V348 H272" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="136" y="348" text-anchor="middle" font-size="18" fill="#475569">A finishes before B writes</text>
    <rect x="24" y="400" width="472" height="48" rx="8" fill="#ffe4e6" stroke="#be123c"/>
    <text x="260" y="431" text-anchor="middle" font-size="21" font-weight="700">Stock = 0 · two orders · oversold</text>
  </g>
</svg>
