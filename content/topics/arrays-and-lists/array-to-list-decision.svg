<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" role="img" aria-labelledby="title description">
  <title id="title">Choose an array-to-list conversion</title>
  <desc id="description">
    Reference arrays can become a source-linked fixed-size view, an independent mutable copy, or an independent unmodifiable snapshot. Primitive arrays must first be boxed and can become either an unmodifiable or mutable boxed list.
  </desc>

  <defs>
    <style>
      .root { fill: #f5f1e9; stroke: #c6c1b6; stroke-width: 2.5; }
      .reference { fill: #eef4ff; stroke: #4773d8; stroke-width: 2; }
      .primitive { fill: #eef8f2; stroke: #2f8d5c; stroke-width: 2; }
      .choice { fill: #ffffff; stroke: #c6c1b6; stroke-width: 1.5; }
      .branch { fill: none; stroke: #76777b; stroke-width: 2; }
      .divider { fill: none; stroke: #cbc7bd; stroke-width: 1.5; }
      .rootText { fill: #1b1c19; font: 700 25px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .heading { fill: #1b1c19; font: 700 22px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .label { fill: #2457a7; font: 700 17px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; }
      .primitiveLabel { fill: #237047; }
      .code { fill: #1b1c19; font: 600 16px 'SFMono-Regular', Consolas, monospace; }
      .detail { fill: #4f5054; font: 500 15px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; }
      .strong { fill: #1b1c19; font-weight: 700; }
      .caveat { fill: #9a5a00; font: 600 14px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <path class="branch" d="M540 94v42H270v34" />
  <path class="branch" d="M540 136h270v34" />

  <rect class="root" x="315" y="20" width="450" height="74" rx="12" />
  <text class="rootText" x="540" y="66">What kind of array do you have?</text>

  <rect class="reference" x="20" y="170" width="500" height="450" rx="12" />
  <text class="heading" x="270" y="207">Reference array</text>

  <rect class="choice" x="50" y="230" width="440" height="102" rx="9" />
  <text class="label" x="72" y="260">Share storage; keep the size fixed</text>
  <text class="code" x="72" y="289">Arrays.asList(array)</text>
  <text class="detail" x="72" y="315"><tspan class="strong">set ✓</tspan><tspan> · </tspan><tspan class="strong">add/remove ✗</tspan><tspan> · changes are shared</tspan></text>

  <rect class="choice" x="50" y="352" width="440" height="102" rx="9" />
  <text class="label" x="72" y="382">Independent mutable list</text>
  <text class="code" x="72" y="411">new ArrayList&lt;&gt;(Arrays.asList(array))</text>
  <text class="detail" x="72" y="437"><tspan class="strong">set/add/remove ✓</tspan><tspan> · source is unchanged</tspan></text>

  <rect class="choice" x="50" y="474" width="440" height="116" rx="9" />
  <text class="label" x="72" y="504">Independent unmodifiable snapshot</text>
  <text class="code" x="72" y="533">List.copyOf(Arrays.asList(array))</text>
  <text class="detail" x="72" y="559"><tspan class="strong">set/add/remove ✗</tspan><tspan> · source is unchanged</tspan></text>
  <text class="caveat" x="72" y="580">Rejects null elements</text>

  <rect class="primitive" x="560" y="170" width="500" height="352" rx="12" />
  <text class="heading" x="810" y="207">Primitive array</text>

  <rect class="choice" x="590" y="230" width="440" height="116" rx="9" />
  <text class="label primitiveLabel" x="612" y="260">Unmodifiable boxed list</text>
  <text class="code" x="612" y="289">Arrays.stream(values)</text>
  <text class="code" x="612" y="314">  .boxed().toList()</text>
  <text class="detail" x="612" y="335">Each primitive becomes its wrapper type</text>

  <rect class="choice" x="590" y="366" width="440" height="126" rx="9" />
  <text class="label primitiveLabel" x="612" y="396">Mutable boxed list</text>
  <text class="code" x="612" y="425">new ArrayList&lt;&gt;(</text>
  <text class="code" x="612" y="450">  Arrays.stream(values).boxed().toList())</text>
  <text class="detail" x="612" y="476">Independent list · set/add/remove ✓</text>
</svg>
