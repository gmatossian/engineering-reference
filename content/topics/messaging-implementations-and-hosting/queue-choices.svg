<svg xmlns="http://www.w3.org/2000/svg" width="420" height="424" viewBox="0 0 360 363" role="img" aria-labelledby="title desc">
  <title id="title">Distribute jobs among workers</title>
  <desc id="desc">SQS Standard is a managed AWS queue service; accept duplicates and out-of-order delivery. RabbitMQ is self-managed or hosted; choose for an existing RabbitMQ platform or specific broker/protocol needs and accept setup and capacity decisions.</desc>
  <rect x="1" y="1" width="358" height="361" rx="8" fill="#ffffff" stroke="#d4dce5"/>
  <path d="M9 1 H351 Q359 1 359 9 V42 H1 V9 Q1 1 9 1" fill="#eaf0f8"/>
  <g font-family="Arial, sans-serif" fill="#25303a">
    <text x="16" y="28" font-size="18" font-weight="700">Distribute jobs among workers</text>
    <text x="16" y="64" font-size="16" fill="#586773">AWS · managed queue service</text>
    <text x="16" y="95" font-size="24" font-weight="700" fill="#355f91">→ SQS Standard</text>
    <text x="16" y="121" font-size="16">Choose: independent worker jobs.</text>
    <text x="16" y="142" font-size="16">Accept: duplicates and delivery</text>
    <text x="16" y="163" font-size="16">that may be out of order.</text>
    <path d="M16 202 H344" stroke="#dce1e7"/>
    <text x="16" y="219" font-size="16" fill="#586773">Self-managed or managed hosting</text>
    <text x="16" y="250" font-size="24" font-weight="700" fill="#355f91">→ RabbitMQ</text>
    <text x="16" y="276" font-size="16">Choose: existing RabbitMQ or its</text>
    <text x="16" y="297" font-size="16">specific broker/protocol features.</text>
    <text x="16" y="318" font-size="16">Accept: setup + capacity decisions.</text>
  </g>
</svg>
