<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 920" role="img" aria-labelledby="title description">
  <title id="title">SortedMap and NavigableMap responsibilities</title>
  <desc id="description">
    SortedMap provides sorted key traversal, endpoint keys, comparator access, and range views. NavigableMap extends SortedMap with nearest-key and nearest-entry searches, descending access, and removable endpoint entries. TreeMap implements NavigableMap and may use natural or custom key ordering.
  </desc>

  <defs>
    <style>
      .sorted { fill: #fff4d6; stroke: #ae6d00; stroke-width: 2.5; }
      .navigable { fill: #eef4ff; stroke: #4773d8; stroke-width: 2.5; }
      .implementation { fill: #eef8f2; stroke: #2f8d5c; stroke-width: 2.5; }
      .construction { fill: #ffffff; stroke: #c6c1b6; stroke-width: 1.5; }
      .branch { fill: none; stroke: #76777b; stroke-width: 2; }
      .divider { fill: none; stroke: #b8b4aa; stroke-width: 1.5; }
      .kind { fill: #5f6064; font: 600 12px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; letter-spacing: 1px; text-anchor: middle; }
      .type { fill: #1b1c19; font: 700 25px 'SFMono-Regular', Consolas, monospace; text-anchor: middle; }
      .purpose { fill: #2457a7; font: 700 18px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .method { fill: #1b1c19; font: 600 16px 'SFMono-Regular', Consolas, monospace; text-anchor: middle; }
      .wideMethod { fill: #1b1c19; font: 600 14px 'SFMono-Regular', Consolas, monospace; text-anchor: middle; }
      .detail { fill: #4f5054; font: 500 15px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .connectorLabel { fill: #5f6064; font: 700 12px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; letter-spacing: 1px; text-anchor: middle; }
      .className { fill: #1b1c19; font: 700 24px 'SFMono-Regular', Consolas, monospace; text-anchor: middle; }
      .choiceLabel { fill: #237047; font: 700 16px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .code { fill: #1b1c19; font: 600 16px 'SFMono-Regular', Consolas, monospace; text-anchor: middle; }
    </style>
  </defs>

  <rect class="sorted" x="135" y="18" width="810" height="240" rx="13" />
  <text class="kind" x="540" y="46">INTERFACE · SORTED KEYS</text>
  <text class="type" x="540" y="82">SortedMap&lt;K, V&gt;</text>
  <text class="purpose" x="540" y="116">Sorted traversal, endpoint keys, and range views</text>
  <path class="divider" d="M175 138h730" />
  <text class="method" x="285" y="178">comparator()</text>
  <text class="detail" x="285" y="205">ordering source</text>
  <text class="method" x="540" y="178">firstKey() · lastKey()</text>
  <text class="detail" x="540" y="205">endpoint keys</text>
  <text class="method" x="795" y="178">headMap · tailMap · subMap</text>
  <text class="detail" x="795" y="205">backed range views</text>

  <path class="branch" d="M540 258v55" />
  <text class="connectorLabel" x="540" y="289">EXTENDS WITH NEAREST AND DIRECTIONAL NAVIGATION</text>

  <rect class="navigable" x="135" y="313" width="810" height="310" rx="13" />
  <text class="kind" x="540" y="341">INTERFACE · NAVIGATION</text>
  <text class="type" x="540" y="377">NavigableMap&lt;K, V&gt;</text>
  <text class="purpose" x="540" y="411">Declare this when nearest keys, entries, or descending access matter</text>
  <path class="divider" d="M175 433h730" />
  <text class="method" x="285" y="474">lowerKey · floorKey</text>
  <text class="detail" x="285" y="501">nearest keys below</text>
  <text class="method" x="540" y="474">ceilingKey · higherKey</text>
  <text class="detail" x="540" y="501">nearest keys above</text>
  <text class="method" x="795" y="474">descendingMap()</text>
  <text class="detail" x="795" y="501">reverse-order view</text>
  <text class="wideMethod" x="540" y="548">lowerEntry · floorEntry · ceilingEntry · higherEntry</text>
  <text class="detail" x="540" y="574">the same searches with both key and value</text>
  <text class="method" x="540" y="594">pollFirstEntry() · pollLastEntry()</text>

  <path class="branch" d="M540 623v55" />
  <text class="connectorLabel" x="540" y="654">IMPLEMENTED BY</text>

  <rect class="implementation" x="165" y="678" width="750" height="218" rx="13" />
  <text class="kind" x="540" y="706">CLASS · USE WITH EITHER INTERFACE</text>
  <text class="className" x="540" y="742">TreeMap&lt;K, V&gt;</text>
  <path class="divider" d="M205 764h670" />

  <rect class="construction" x="205" y="786" width="310" height="82" rx="9" />
  <text class="choiceLabel" x="360" y="814">Natural key order</text>
  <text class="code" x="360" y="844">new TreeMap&lt;&gt;()</text>

  <rect class="construction" x="565" y="786" width="310" height="82" rx="9" />
  <text class="choiceLabel" x="720" y="814">Custom key order</text>
  <text class="code" x="720" y="844">new TreeMap&lt;&gt;(comparator)</text>
</svg>
