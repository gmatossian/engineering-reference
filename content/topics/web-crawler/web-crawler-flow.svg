<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 980" role="img" aria-labelledby="title description">
  <title id="title">High-level web crawler architecture</title>
  <desc id="description">
    Seed URLs enter the URL Frontier, then move down through the HTML Downloader, Content Parser, content deduplication, URL extraction, filtering, and URL deduplication. New URLs loop back to the frontier. The downloader uses a DNS resolver, while content and URL histories are kept in storage.
  </desc>

  <defs>
    <style>
      .component { fill: #eef4ff; stroke: #2457a7; stroke-width: 2; }
      .support { fill: #ffffff; stroke: #c6c1b6; stroke-width: 2; }
      .decision { fill: #f2f7ef; stroke: #5f8656; stroke-width: 2; }
      .storage { fill: #f5f1e8; stroke: #9a8354; stroke-width: 2; }
      .flow { fill: none; stroke: #76777b; stroke-width: 2; marker-end: url(#arrow); }
      .two-way { fill: none; stroke: #76777b; stroke-width: 2; marker-start: url(#reverse-arrow); marker-end: url(#arrow); }
      .loop { fill: none; stroke: #2457a7; stroke-width: 2; marker-end: url(#blue-arrow); }
      .type { fill: #1b1c19; font: 600 22px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
      .side-label { fill: #1b1c19; font: 600 18px 'Plus Jakarta Sans', 'Avenir Next', 'Segoe UI', sans-serif; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#76777b" />
    </marker>
    <marker id="reverse-arrow" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <path d="M9,0 L9,6 L0,3 z" fill="#76777b" />
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2457a7" />
    </marker>
  </defs>

  <rect class="component" x="160" y="20" width="280" height="64" rx="8" />
  <text class="type" x="300" y="60">Seed URLs</text>
  <path class="flow" d="M300 84v46" />

  <rect class="component" x="160" y="140" width="280" height="64" rx="8" />
  <text class="type" x="300" y="180">URL Frontier</text>
  <path class="flow" d="M300 204v46" />

  <rect class="component" x="160" y="260" width="280" height="64" rx="8" />
  <text class="type" x="300" y="300">HTML Downloader</text>
  <rect class="support" x="470" y="260" width="120" height="64" rx="8" />
  <text class="side-label" x="530" y="286">DNS</text>
  <text class="side-label" x="530" y="308">Resolver</text>
  <path class="two-way" d="M450 292h10" />
  <path class="flow" d="M300 324v46" />

  <rect class="component" x="160" y="380" width="280" height="64" rx="8" />
  <text class="type" x="300" y="420">Content Parser</text>
  <path class="flow" d="M300 444v46" />

  <rect class="decision" x="160" y="500" width="280" height="64" rx="8" />
  <text class="type" x="300" y="540">Content Seen?</text>
  <rect class="storage" x="470" y="500" width="120" height="64" rx="8" />
  <text class="side-label" x="530" y="526">Content</text>
  <text class="side-label" x="530" y="548">Storage</text>
  <path class="two-way" d="M450 532h10" />
  <path class="flow" d="M300 564v46" />

  <rect class="component" x="160" y="620" width="280" height="64" rx="8" />
  <text class="type" x="300" y="660">URL Extractor</text>
  <path class="flow" d="M300 684v46" />

  <rect class="component" x="160" y="740" width="280" height="64" rx="8" />
  <text class="type" x="300" y="780">URL Filter</text>
  <path class="flow" d="M300 804v46" />

  <rect class="decision" x="160" y="860" width="280" height="64" rx="8" />
  <text class="type" x="300" y="900">URL Seen?</text>
  <rect class="storage" x="470" y="860" width="120" height="64" rx="8" />
  <text class="side-label" x="530" y="886">URL</text>
  <text class="side-label" x="530" y="908">Storage</text>
  <path class="two-way" d="M450 892h10" />

  <path class="loop" d="M160 892H70V172h80" />
</svg>
